name: Upload screenshots
on:
  workflow_run:
    workflows: ["Capture screenshotties"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Capture screenshotties workflow run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: upload-screenshots-${{ inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  upload:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          name: screenshots
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          # Keep artefact contents outside the trusted checkout so they can't overwrite repository files before the upload.
          path: ${{ runner.temp }}/screenshots

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Upload screenshots to S3
        env:
          S3_USER_ACCESS_KEY: ${{ secrets.S3_USER_ACCESS_KEY }}
          S3_USER_ACCESS_KEY_SECRET: ${{ secrets.S3_USER_ACCESS_KEY_SECRET }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          SCREENSHOT_ARTIFACT_DIR: ${{ runner.temp }}/screenshots
        run: node upload-screenshots.js

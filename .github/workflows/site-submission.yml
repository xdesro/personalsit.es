name: Site submissions
on:
  issues:
    types: [opened, edited, reopened, labeled]

jobs:
  validate:
    permissions:
      contents: read
      issues: write
    if: |
      (github.event.action == 'opened' || github.event.action == 'edited' || github.event.action == 'reopened') &&
      (contains(github.event.issue.labels.*.name, 'site-submission') || startsWith(github.event.issue.title, '[Site submission]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Validate submission
        env:
          MODE: validate
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/site-submission.mjs

  publish:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      github.event.action == 'labeled' &&
      github.event.label.name == 'approved' &&
      (contains(github.event.issue.labels.*.name, 'site-submission') || startsWith(github.event.issue.title, '[Site submission]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Open pull request
        env:
          MODE: publish
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/site-submission.mjs

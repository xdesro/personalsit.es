name: Capture screenshotties
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "sites/*.yaml"

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request head
        run: git fetch origin pull/${{ github.event.pull_request.number }}/head:pr_head

      - name: Apply submitted site entries
        run: git checkout pr_head -- sites/

      - name: Find changed site entries
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE_SHA" pr_head -- 'sites/*.yaml' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Configure Chromium
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome=$(command -v "$candidate")
              break
            fi
          done

          if [ -n "${chrome:-}" ]; then
            echo "Using system Chrome: $chrome"
            echo "PUPPETEER_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          else
            echo "System Chrome not found; installing Puppeteer Chrome"
            PUPPETEER_SKIP_DOWNLOAD=false \
              PUPPETEER_CHROME_SKIP_DOWNLOAD=false \
              PUPPETEER_SKIP_CHROME_DOWNLOAD=false \
              ./node_modules/.bin/puppeteer browsers install chrome
          fi

      - name: Verify Chromium
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import puppeteer from 'puppeteer'; const path = puppeteer.executablePath(); console.log(path); if (!fs.existsSync(path)) process.exit(1);"

      - name: Capture screenshots
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          SCREENSHOT_OUTPUT_DIR: screenshots
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node screenshot-new-site.js

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          retention-days: 1
          if-no-files-found: error

  trigger-upload:
    needs: capture
    if: |
      github.actor == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger screenshot upload
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh workflow run upload-screenshots.yml --ref main -f run_id="$RUN_ID"

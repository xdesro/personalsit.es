name: Capture screenshotties
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "sites/*.yaml"

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.puppeteer-cache
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request head
        run: git fetch origin pull/${{ github.event.pull_request.number }}/head:pr_head

      - name: Apply submitted site entries
        run: git checkout pr_head -- sites/

      - name: Find changed site entries
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE_SHA" pr_head -- 'sites/*.yaml' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Install Chromium
        run: ./node_modules/.bin/puppeteer browsers install chrome

      - name: Verify Chromium
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import puppeteer from 'puppeteer'; const path = puppeteer.executablePath(); console.log(path); if (!fs.existsSync(path)) process.exit(1);"

      - name: Capture screenshots
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          SCREENSHOT_OUTPUT_DIR: screenshots
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node screenshot-new-site.js

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          retention-days: 1
          if-no-files-found: error

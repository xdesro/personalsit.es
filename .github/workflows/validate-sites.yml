name: Validate site entries
on:
  pull_request:
    paths:
      - "sites/*.yaml"
      - "sites.schema.json"
      - "validateSites.js"
      - ".github/ISSUE_TEMPLATE/*.yml"
      - ".github/scripts/*.mjs"
      - ".github/workflows/site-submission.yml"
      - ".github/workflows/screenshot-new-site.yml"
      - ".github/workflows/screenshot-update.yml"
      - ".github/workflows/upload-screenshots.yml"
      - "screenshot-new-site.js"
      - "upload-screenshots.js"
      - "test/*.mjs"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate site entries
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Check issue form tags
        run: npm run check:issue-form

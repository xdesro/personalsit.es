name: Validate site entries
on:
  pull_request_target:
    paths:
      - "sites/*.yaml"
      - "sites.schema.json"
      - "validateSites.js"
      - ".github/ISSUE_TEMPLATE/*.yml"
      - ".github/scripts/*.mjs"
      - ".github/workflows/site-submission.yml"
      - ".github/workflows/screenshot-new-site.yml"
      - ".github/workflows/screenshot-on-push.yml"
      - ".github/workflows/screenshot-update.yml"
      - ".github/workflows/upload-screenshots.yml"
      - "screenshot-new-site.js"
      - "upload-screenshots.js"
      - "test/*.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch pull request head
        run: git fetch origin pull/${{ github.event.pull_request.number }}/head:pr_head

      - name: Apply submitted site data
        run: git checkout pr_head -- sites/ sites.schema.json .github/ISSUE_TEMPLATE/

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate site entries
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Check issue form tags
        run: npm run check:issue-form
